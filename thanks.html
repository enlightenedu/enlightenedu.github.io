<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提交成功 — 启商智策管理咨询</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .thanks-section {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        }
        .thanks-card {
            background: #fff;
            padding: 60px 50px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            max-width: 520px;
        }
        .thanks-icon {
            font-size: 64px;
            margin-bottom: 24px;
        }
        .thanks-card h1 {
            font-size: 1.8rem;
            color: #1a1a2e;
            margin-bottom: 16px;
        }
        .thanks-card p {
            font-size: 1.05rem;
            color: #555;
            line-height: 1.8;
            margin-bottom: 32px;
        }
        .thanks-card .btn {
            display: inline-block;
            padding: 14px 40px;
            background: #1a1a2e;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1rem;
            transition: background 0.3s;
        }
        .thanks-card .btn:hover {
            background: #2d2d44;
        }
    </style>
</head>
<body>
    <section class="thanks-section">
        <div class="thanks-card">
            <div class="thanks-icon">✅</div>
            <h1>感谢您的咨询！</h1>
            <p>您的信息已成功提交。<br>我们的顾问将在 <strong>1-2 个工作日</strong>内与您联系，<br>请留意您的手机和邮箱。</p>
            <a href="index.html" class="btn">返回首页</a>
        </div>
    </section>
</body>
</html>
