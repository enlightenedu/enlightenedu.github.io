<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>OAuth</title></head>
<body>
<script>
(async function() {
  var CLIENT_ID = 'Ov23li9xWJ3xRpRROBL4';
  var CLIENT_SECRET = atob('MGY5YzY3MjJlNjY2ZWU5ZWE3NDhkNjljOTVjZTg3ZjUzZmI4YzQ4NQ==');

  // === AUTH: detect hash route from CMS ===
  var hash = location.hash.replace(/^#/, '');
  if (hash.startsWith('/auth')) {
    var hp = new URLSearchParams(hash.slice(hash.indexOf('?') + 1));
    var scope = hp.get('scope') || 'repo';
    var siteId = hp.get('site_id') || '';
    // redirect_uri has NO fragment — GitHub uses query string for callback
    var redirectUri = location.origin + location.pathname;
    var authUrl = 'https://github.com/login/oauth/authorize?' + new URLSearchParams({
      client_id: CLIENT_ID,
      scope: scope,
      redirect_uri: redirectUri,
      state: siteId
    });
    location.href = authUrl;
    return;
  }

  // === CALLBACK: detect code in query string from GitHub ===
  var qp = new URLSearchParams(location.search);
  var code = qp.get('code');
  if (code) {
    var state = qp.get('state');
    var error = qp.get('error');
    if (error) {
      window.opener.postMessage({ error: 'auth_denied: ' + error }, '*');
      window.close();
      return;
    }
    try {
      var resp = await fetch('https://corsproxy.io/?' + encodeURIComponent(
        'https://github.com/login/oauth/access_token'
      ), {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
          'Accept': 'application/json'
        },
        body: new URLSearchParams({
          client_id: CLIENT_ID,
          client_secret: CLIENT_SECRET,
          code: code,
          state: state || ''
        })
      });
      var data = await resp.json();
      if (data.access_token) {
        window.opener.postMessage({
          token: data.access_token,
          provider: 'github'
        }, window.opener.location.origin);
        setTimeout(function() { window.close(); }, 500);
      } else {
        window.opener.postMessage({
          error: 'token_error: ' + JSON.stringify(data)
        }, '*');
        setTimeout(function() { window.close(); }, 500);
      }
    } catch (e) {
      window.opener.postMessage({ error: 'network_error: ' + e.message }, '*');
      setTimeout(function() { window.close(); }, 500);
    }
    return;
  }

  document.body.innerHTML = '<p style="text-align:center;margin-top:40px;">OAuth proxy ready.</p>';
})();
</script>
</body>
</html>
