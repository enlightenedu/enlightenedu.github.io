backend:
  name: github
  repo: enlightenedu/github.io
  branch: main
  base_url: https://decap-cms-oauth.netlify.app
  client_id: Ov23li9xWJ3xRpRROBL4  # ← 把这里替换成你的 GitHub OAuth App Client ID

# 媒体文件存储位置
media_folder: "images/uploads"
public_folder: "/github.io/images/uploads"

# 网站地址
site_url: https://enlightenedu.github.io/github.io
display_url: https://enlightenedu.github.io/github.io

# 语言
locale: "zh_Hans"

# 集合定义
collections:
  - name: "news"
    label: "动态新闻"
    label_singular: "新闻"
    folder: "content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    editor:
      preview: false
    fields:
      - label: "标题"
        name: "title"
        widget: "string"
        hint: "新闻标题，会显示在首页和新闻列表中"
      - label: "发布日期"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        default: ""
      - label: "分类"
        name: "category"
        widget: "select"
        options:
          - { label: "公司新闻", value: "公司新闻" }
          - { label: "行业洞察", value: "行业洞察" }
          - { label: "案例分享", value: "案例分享" }
          - { label: "活动预告", value: "活动预告" }
        default: "公司新闻"
      - label: "摘要"
        name: "summary"
        widget: "text"
        hint: "简短摘要，显示在新闻列表中（约 50-100 字）"
      - label: "封面图片"
        name: "image"
        widget: "image"
        required: false
        hint: "可选，建议尺寸 800×400px"
      - label: "正文"
        name: "body"
        widget: "markdown"
        hint: "新闻正文，支持 Markdown 格式"

  # 网站配置（Hero + 页脚）
  - name: "siteConfig"
    label: "网站配置"
    editor:
      preview: false
    files:
      - label: "首页 Hero 和页脚"
        name: "site-config"
        file: "content/sections/site-config.json"
        fields:
          - label: "Hero 大标题"
            name: "hero"
            widget: "object"
            fields:
              - { label: "标题", name: "title", widget: "string" }
              - { label: "副标题", name: "subtitle", widget: "string" }
              - { label: "描述", name: "description", widget: "text" }
              - { label: "主按钮文字", name: "btnPrimary", widget: "string" }
              - { label: "次按钮文字", name: "btnSecondary", widget: "string" }
          - label: "页脚"
            name: "footer"
            widget: "object"
            fields:
              - { label: "品牌名", name: "brandName", widget: "string" }
              - { label: "标语", name: "tagline", widget: "string" }
              - { label: "版权文字", name: "copyright", widget: "string" }

  # 关于我们
  - name: "aboutPage"
    label: "关于我们"
    editor:
      preview: false
    files:
      - label: "关于我们内容"
        name: "about"
        file: "content/sections/about.json"
        fields:
          - { label: "标题", name: "heading", widget: "string" }
          - { label: "副标题", name: "subtitle", widget: "string" }
          - { label: "公司名称", name: "companyName", widget: "string" }
          - label: "公司简介"
            name: "intro"
            widget: "list"
            field: { label: "段落", name: "paragraph", widget: "text" }
          - label: "数据统计"
            name: "stats"
            widget: "list"
            fields:
              - { label: "数字", name: "number", widget: "string" }
              - { label: "标签", name: "label", widget: "string" }
          - { label: "使命", name: "mission", widget: "text" }
          - { label: "愿景", name: "vision", widget: "text" }
          - { label: "价值观", name: "values", widget: "text" }
      - label: "联系方式"
        name: "contact"
        file: "content/sections/contact.json"
        fields:
          - { label: "标题", name: "heading", widget: "string" }
          - { label: "副标题", name: "subtitle", widget: "string" }
          - { label: "地址", name: "address", widget: "string" }
          - { label: "电话", name: "phone", widget: "string" }
          - { label: "邮箱", name: "email", widget: "string" }
          - { label: "工作时间", name: "hours", widget: "string" }

  # 服务项目
  - name: "servicesPage"
    label: "服务项目"
    editor:
      preview: false
    files:
      - label: "服务项目内容"
        name: "services"
        file: "content/sections/services.json"
        fields:
          - { label: "标题", name: "heading", widget: "string" }
          - { label: "副标题", name: "subtitle", widget: "string" }
          - label: "服务列表"
            name: "items"
            widget: "list"
            fields:
              - { label: "图标(emoji)", name: "icon", widget: "string" }
              - { label: "服务名称", name: "title", widget: "string" }
              - { label: "服务描述", name: "description", widget: "text" }
              - label: "子项"
                name: "details"
                widget: "list"
                field: { label: "子项", name: "item", widget: "string" }
